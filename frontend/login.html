<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EcoCampus - Connexion</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

    <div class="container">

        <!-- Côté gauche : Visuel avec image d'arrière-plan -->
        <div class="visual-side">
            <div class="brand">
                <img src="images/logo.png" alt="Logo EcoCampus">
            </div>

            <div class="welcome">
                <span class="tagline">UN CAMPUS PLUS VERT COMMENCE ICI</span>
                <h1>Chaque goutte et chaque watt comptent.</h1>
                <p>Une gestion intelligente des ressources pour un campus plus durable.</p>
            </div>

            <div class="footer-text">
                <p>Suivre. Réduire. Agir pour l'impact.</p>
            </div>
        </div>

        <!-- Côté droit : Formulaire -->
        <div class="login-side">
            <div class="login-box">
                <span class="welcome-badge">BON RETOUR</span>
                <h2>Connexion</h2>
                <p class="subtitle">Entrez vos identifiants pour continuer.</p>

                <form method="POST" action="../backend/login.php">

                    <div class="form-group">
                        <label for="email">Adresse e-mail</label>
                        <input type="email" id="email" name="email" placeholder="tu@exemple.com" required>
                    </div>

                    <div class="form-group">
                        <label for="password">Mot de passe</label>
                        <input type="password" id="password" name="password" placeholder="Votre mot de passe" required>
                    </div>

                    <!-- CAPTCHA JS -->
                    <div class="form-group">
                        <label id="captchaLabel" for="captcha">Combien font X + Y ?</label>
                        <input type="number" id="captcha" name="captcha" placeholder="Votre réponse" required>
                        <input type="hidden" id="captchaCorrect" name="captchaCorrect">
                    </div>

                    <button type="submit" name="login">Se connecter &rarr;</button>

                </form>

                <p class="bottom-text">ÉCOSYSTÈME &bull; ECOCAMPUS</p>
            </div>
        </div>

    </div>

    <!-- Script de génération du CAPTCHA -->
    <script src="assets/js/captcha.js"></script>

</body>
</html>
